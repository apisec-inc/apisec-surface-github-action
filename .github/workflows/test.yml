name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: surface
        uses: ./
        with:
          path: tests/fixtures/flask-app
          dry-run: 'true'
      - name: Check outputs
        shell: bash
        env:
          ROUTES: ${{ steps.surface.outputs.endpoints-count }}
          FRAMEWORKS: ${{ steps.surface.outputs.frameworks-detected }}
          SUCCESS: ${{ steps.surface.outputs.success }}
        run: |
          echo "routes=$ROUTES frameworks=$FRAMEWORKS success=$SUCCESS"
          test "$SUCCESS" = "true"
          test "$ROUTES" -ge 2
          case ",$FRAMEWORKS," in *,flask,*) ;; *) echo "flask not detected"; exit 1 ;; esac

  missing-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: surface
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/flask-app
          dry-run: 'false'
      - name: Expect a clear failure
        if: steps.surface.outcome != 'failure'
        run: exit 1
